services:
  electron-cash:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EC_VERSION: ${EC_VERSION:?EC_VERSION must be set in .env}
        EC_COMMIT: ${EC_COMMIT:?EC_COMMIT must be set in .env}
        EC_ARCHIVE_SHA256: ${EC_ARCHIVE_SHA256:?EC_ARCHIVE_SHA256 must be set in .env}
        NOVNC_VERSION: ${NOVNC_VERSION:?NOVNC_VERSION must be set in .env}
        NOVNC_COMMIT: ${NOVNC_COMMIT:?NOVNC_COMMIT must be set in .env}
        NOVNC_ARCHIVE_SHA256: ${NOVNC_ARCHIVE_SHA256:?NOVNC_ARCHIVE_SHA256 must be set in .env}
    image: electron-cash:${EC_VERSION:?EC_VERSION must be set in .env}
    restart: "on-failure:5"
    stop_grace_period: 15s
    ports:
      - "${NOVNC_BIND:?NOVNC_BIND must be set in .env}:${NOVNC_HOST_PORT:?NOVNC_HOST_PORT must be set in .env}:6080"
    environment:
      USE_TOR: ${USE_TOR:?USE_TOR must be set in .env}
      CASHFUSION_ENABLED: ${CASHFUSION_ENABLED:?CASHFUSION_ENABLED must be set in .env}
      CASHFUSION_AUTO_FUSE: ${CASHFUSION_AUTO_FUSE:?CASHFUSION_AUTO_FUSE must be set in .env}
      WALLET_AUTO_CREATE: ${WALLET_AUTO_CREATE:-false}
      TEST_WALLET_PASSWORD: ${TEST_WALLET_PASSWORD:-}
    volumes:
      - electron-cash-data:/home/electroncash/.electron-cash
    depends_on:
      tor-proxy:
        condition: service_started
    networks:
      - electron-network

  tor-proxy:
    build:
      context: ./docker/tor
      dockerfile: Dockerfile
      args:
        TOR_VERSION: ${TOR_VERSION:?TOR_VERSION must be set in .env}
        TOR_SOURCE_SHA256: ${TOR_SOURCE_SHA256:?TOR_SOURCE_SHA256 must be set in .env}
    image: bchforge/electron-cash-docker-tor:${TOR_VERSION:?TOR_VERSION must be set in .env}
    restart: on-failure
    stop_grace_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "9050"
    volumes:
      - tor-data:/var/lib/tor
    networks:
      - electron-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/tor-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

networks:
  electron-network:
    driver: bridge

volumes:
  electron-cash-data:
    name: bchforge-electron-cash-data
  tor-data:
    name: bchforge-electron-cash-tor-data
