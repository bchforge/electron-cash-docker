x-runtime-policy: &runtime-policy
  pids_limit: 64
  mem_limit: 256m
  cpus: 1.0
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  electron-cash:
    <<: *runtime-policy
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/electroncash/.cache:size=64m,uid=10001,gid=10001,mode=700
      - /home/electroncash/.dbus:size=1m,uid=10001,gid=10001,mode=700
      - /home/electroncash/.local/share:size=16m,uid=10001,gid=10001,mode=700
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        EC_VERSION: ${EC_VERSION:?EC_VERSION must be set in .env}
        EC_COMMIT: ${EC_COMMIT:?EC_COMMIT must be set in .env}
        EC_ARCHIVE_SHA256: ${EC_ARCHIVE_SHA256:?EC_ARCHIVE_SHA256 must be set in .env}
        NOVNC_VERSION: ${NOVNC_VERSION:?NOVNC_VERSION must be set in .env}
        NOVNC_COMMIT: ${NOVNC_COMMIT:?NOVNC_COMMIT must be set in .env}
        NOVNC_ARCHIVE_SHA256: ${NOVNC_ARCHIVE_SHA256:?NOVNC_ARCHIVE_SHA256 must be set in .env}
        HW_SUPPORT: "0"
    image: ${ELECTRON_CASH_IMAGE:-electron-cash:${EC_VERSION:?EC_VERSION must be set in .env}}
    pull_policy: never
    restart: "on-failure:5"
    stop_grace_period: 15s
    expose:
      - "6080"
    environment:
      MODE: ${MODE:-novnc}
      ECD_GUI_SESSION: "true"
      USE_TOR: ${USE_TOR:?USE_TOR must be set in .env}
      NETWORK: ${NETWORK-mainnet}
      EC_LANGUAGE: ${EC_LANGUAGE-en_US}
      DARK_MODE: ${DARK_MODE-false}
      CHIPNET: ${CHIPNET:-false}
      TESTNET4: ${TESTNET4:-false}
      ELECTRONCASH_ARGS: ${ELECTRONCASH_ARGS:-}
      CASHFUSION_ENABLED: ${CASHFUSION_ENABLED:-true}
      CASHFUSION_AUTO_FUSE: ${CASHFUSION_AUTO_FUSE:-false}
      CASHFUSION_FUSION_MODE: ${CASHFUSION_FUSION_MODE:-custom}
      CASHFUSION_FUSE_DEPTH: ${CASHFUSION_FUSE_DEPTH:-3}
      CASHFUSION_SELF_FUSE_PLAYERS: ${CASHFUSION_SELF_FUSE_PLAYERS:-1}
      CASHFUSION_SELECTOR_MODE: ${CASHFUSION_SELECTOR_MODE:-count}
      CASHFUSION_SELECTOR_COUNT: ${CASHFUSION_SELECTOR_COUNT:-10}
      CASHFUSION_SELECTOR_SIZE_BCH: ${CASHFUSION_SELECTOR_SIZE_BCH:-0.0001}
      CASHFUSION_SELECTOR_FRACTION: ${CASHFUSION_SELECTOR_FRACTION:-1.0}
      CASHFUSION_QUEUED_AUTOFUSE: ${CASHFUSION_QUEUED_AUTOFUSE:-4}
      CASHFUSION_AUTOFUSE_CONFIRMED_ONLY: ${CASHFUSION_AUTOFUSE_CONFIRMED_ONLY:-true}
      CASHFUSION_FEE_BUDGET: ${CASHFUSION_FEE_BUDGET-0}
      CASHFUSION_MIN_UTXO: ${CASHFUSION_MIN_UTXO-1000}
      JSONRPC_ENABLED: ${JSONRPC_ENABLED:-false}
      JSONRPC_USER: ${JSONRPC_USER:-}
      JSONRPC_PASSWORD: ${JSONRPC_PASSWORD:-}
      JSONRPC_PORT: ${JSONRPC_PORT:-50001}
      WALLET_AUTO_CREATE: ${WALLET_AUTO_CREATE:-false}
      TEST_WALLET_PASSWORD: ${TEST_WALLET_PASSWORD:-}
    healthcheck:
      test: ["CMD", "/opt/electroncash-venv/bin/python", "/home/electroncash/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - electron-cash-data:/home/electroncash/.electron-cash
      - gui-session-state:/run/ecd-gui-session
    networks:
      - electron-network

  auth-session:
    <<: *runtime-policy
    build:
      context: .
      dockerfile: docker/auth-session/Dockerfile
    image: ${AUTH_SESSION_IMAGE:-electron-cash-docker-auth-session:1.0}
    pull_policy: never
    restart: on-failure:5
    entrypoint: ["/bin/sh", "/usr/local/bin/gui-session", "python3", "/home/authsession/server.py"]
    depends_on:
      electron-cash:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORD must be set to a real password before starting Electron Cash Docker}
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
      EC_LANGUAGE: ${EC_LANGUAGE-en_US}
      ECD_GUI_SESSION: "true"
      ECD_GUI_NOTIFY_GRACE: "6"
    volumes:
      - auth-session-data:/auth-data
      - gui-session-state:/run/ecd-gui-session:ro
      - type: bind
        source: ./docker/gui-session.sh
        target: /usr/local/bin/gui-session
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - electron-network

  caddy:
    <<: *runtime-policy
    pids_limit: 128
    mem_limit: 512m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
      args:
        CADDY_VERSION: ${CADDY_VERSION-2.11.7}
        CADDY_ARCHIVE_SHA256: ${CADDY_ARCHIVE_SHA256-86e39de5fa0bc433a9cd574a00e7751059903401f3389c61f8937fd0ad0180f5}
      entitlements:
        - network.host
    image: ${CADDY_IMAGE:-electron-cash-docker-caddy:1.0}
    pull_policy: never
    restart: on-failure:5
    entrypoint: ["/bin/sh", "/usr/local/bin/gui-session", "/bin/sh", "/etc/caddy/entrypoint.sh"]
    depends_on:
      electron-cash:
        condition: service_healthy
      auth-session:
        condition: service_started
    ports:
      - "${CADDY_EDGE_BIND:-127.0.0.1}:${CADDY_HTTP_HOST_PORT:-80}:80"
      - "${CADDY_EDGE_BIND:-127.0.0.1}:${CADDY_HTTPS_HOST_PORT:-443}:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-auto}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-}
      ECD_MODE: ${MODE:-novnc}
      AUTH_SESSION_UPSTREAM: auth-session:8080
      CADDY_VERSION: ${CADDY_VERSION-2.11.7}
      CADDY_ARCHIVE_SHA256: ${CADDY_ARCHIVE_SHA256-86e39de5fa0bc433a9cd574a00e7751059903401f3389c61f8937fd0ad0180f5}
      ECD_GUI_SESSION: "true"
      ECD_GUI_NOTIFY_GRACE: "6"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-log:/var/log/caddy
      - caddy-ban-state:/var/lib/caddy-bans
      - caddy-control:/run/caddy
      - gui-session-state:/run/ecd-gui-session:ro
      - type: bind
        source: ./docker/gui-session.sh
        target: /usr/local/bin/gui-session
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/caddy-entrypoint.sh
        target: /etc/caddy/entrypoint.sh
        read_only: true
        bind:
          create_host_path: false
    networks:
      - electron-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --unix-socket /run/caddy/admin.sock http://localhost/config/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  fail2ban:
    <<: *runtime-policy
    read_only: true
    build:
      context: ./docker/fail2ban
      dockerfile: Dockerfile
    image: ${FAIL2BAN_IMAGE:-electron-cash-docker-fail2ban:1.0}
    pull_policy: never
    restart: on-failure:5
    entrypoint: ["/bin/sh", "/usr/local/bin/gui-session", "/bin/bash", "/entrypoint.sh"]
    depends_on:
      caddy:
        condition: service_healthy
        restart: true
    network_mode: service:caddy
    cap_add: [NET_ADMIN]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      FAIL2BAN_MAXRETRY: ${FAIL2BAN_MAXRETRY:-5}
      FAIL2BAN_FINDTIME: ${FAIL2BAN_FINDTIME:-600}
      FAIL2BAN_BANTIME: ${FAIL2BAN_BANTIME:-3600}
      FAIL2BAN_IGNOREIP: ${FAIL2BAN_IGNOREIP:-127.0.0.0/8 ::1}
      CADDY_EDGE_BIND: ${CADDY_EDGE_BIND:-127.0.0.1}
      ECD_GUI_SESSION: "true"
    volumes:
      - caddy-log:/var/log/caddy:ro
      - caddy-ban-state:/var/lib/caddy-bans
      - caddy-control:/run/caddy
      - fail2ban-state:/var/lib/fail2ban
      - gui-session-state:/run/ecd-gui-session:ro
      - type: bind
        source: ./docker/gui-session.sh
        target: /usr/local/bin/gui-session
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run:size=16m
      - /etc/fail2ban/jail.d:size=1m
    healthcheck:
      test: ["CMD-SHELL", "fail2ban-client status caddy-basicauth >/dev/null 2>&1 && /usr/local/bin/caddy-ban check >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  tor-proxy:
    <<: *runtime-policy
    build:
      context: ./docker/tor
      dockerfile: Dockerfile
      args:
        TOR_VERSION: ${TOR_VERSION:?TOR_VERSION must be set in .env}
        TOR_SOURCE_SHA256: ${TOR_SOURCE_SHA256:?TOR_SOURCE_SHA256 must be set in .env}
    image: ${TOR_IMAGE:-bchforge/electron-cash-docker-tor:${TOR_VERSION:?TOR_VERSION must be set in .env}}
    pull_policy: never
    restart: "on-failure:5"
    entrypoint: ["/bin/sh", "/usr/local/bin/gui-session", "/usr/local/bin/tor"]
    command: ["-f", "/etc/tor/torrc"]
    depends_on:
      electron-cash:
        condition: service_healthy
    environment:
      ECD_GUI_SESSION: "true"
    stop_grace_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "9050"
    volumes:
      - tor-data:/var/lib/tor
      - gui-session-state:/run/ecd-gui-session:ro
      - type: bind
        source: ./docker/gui-session.sh
        target: /usr/local/bin/gui-session
        read_only: true
        bind:
          create_host_path: false
    networks:
      - electron-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/tor-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

networks:
  electron-network:
    driver: bridge

volumes:
  auth-session-data:
  gui-session-state:
  electron-cash-data:
    name: ${ECD_WALLET_VOLUME:-bchforge-electron-cash-data}
  tor-data:
    name: ${ECD_TOR_VOLUME:-bchforge-electron-cash-tor-data}
  caddy-data:
  caddy-config:
  caddy-log:
  fail2ban-state:
  caddy-ban-state:
  caddy-control:
